name: Publish prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Download AE2 UELM 15.5.3
        run: |
          curl --fail --location --output "$RUNNER_TEMP/ae2-uelm.jar" \
            "https://github.com/AE2-Unofficial-Extended-Life-Modern/AE2-UELM/releases/download/forge%2Fv15.5.3-uelm/appliedenergistics2-forge-15.5.3-uelm.jar"
          echo "95f5c2c3097cfea9e13ebf3c54a48c9f43f8ff75239eb292e43878b40dc2a741  $RUNNER_TEMP/ae2-uelm.jar" | sha256sum --check
      - name: Build
        run: ./gradlew clean build --no-configuration-cache -Pae2_local_jar="$RUNNER_TEMP/ae2-uelm.jar"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar
          --prerelease
          --generate-notes
          --title "AE2 Crafting Recovery $GITHUB_REF_NAME"
