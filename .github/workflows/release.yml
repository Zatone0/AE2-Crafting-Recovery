name: Release

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Download AE2 UELM 15.5.4
        run: |
          curl --fail --location --output "$RUNNER_TEMP/ae2-uelm.jar" \
            "https://github.com/AE2-Unofficial-Extended-Life-Modern/AE2-UELM/releases/download/forge%2Fv15.5.4-uelm/appliedenergistics2-forge-15.5.4-uelm.jar"
          echo "83d4b3026c4cda1d1feb4d3462d5cbf5e24fb523e03403ddd98ea451f88f8b90  $RUNNER_TEMP/ae2-uelm.jar" | sha256sum --check
      - name: Validate version and extract notes
        run: python3 scripts/release.py prepare
      - name: Build
        run: ./gradlew clean build --no-configuration-cache -Pae2_local_jar="$RUNNER_TEMP/ae2-uelm.jar"
      - name: Package and verify
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: build/release/*
          if-no-files-found: error

  github:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/*.jar dist/SHA256SUMS.txt \
            --verify-tag --title "AE2 Crafting Recovery $TAG" \
            --notes-file dist/notes.md "${prerelease[@]}"

  curseforge:
    if: startsWith(github.ref, 'refs/tags/')
    needs: github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build/release
      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 scripts/release.py curseforge
